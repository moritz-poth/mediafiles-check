[package]
name = "mediafiles-check"
version = "1.0.0-beta.5"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Checks whether every Avid MXF folder matches its Avid database"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libc = "0.2.191"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
unicode-normalization = "0.1.26"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[build-dependencies]
slint-build = "1.18.1"

[[bin]]
name = "mfcheck"
path = "src/main.rs"

[[bin]]
name = "mediafiles-check"
path = "src/app.rs"
